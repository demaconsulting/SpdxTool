---
# SpdxToolTargets system-level requirements
sections:
  - title: SpdxToolTargets Requirements
    requirements:
      - id: SpdxToolTargets-DecorateSbomDuringPack
        title: >-
          The system shall decorate SBOMs during dotnet pack when IsPackable,
          GenerateSBOM, and DecorateSBOM are all true.
        tags:
          - system
          - msbuild
          - sbom
        justification: |
          Users need SBOM decoration integrated into their standard build process
          without manual intervention. Automatic decoration during pack ensures
          SBOMs are consistently enhanced for both single-TFM and multi-TFM projects.
        children:
          - SpdxToolTargets-SingleTfm-DecorateWhenEnabled
          - SpdxToolTargets-MultiTfm-DecorateWhenEnabled
        tests:
          - SpdxToolTargets_DecorateSbom_SingleTfm_True_DecoratesSbom
          - SpdxToolTargets_DecorateSbom_MultiTfm_True_DecoratesSbom

      - id: SpdxToolTargets-SkipDecorationWhenDisabled
        title: The system shall skip SBOM decoration when DecorateSBOM is false.
        tags:
          - system
          - msbuild
          - sbom
        justification: |
          Users must be able to opt out of SBOM decoration for projects where it is
          not needed or desired. The default behavior respects user choice by not
          decorating unless explicitly enabled.
        children:
          - SpdxToolTargets-SingleTfm-SkipWhenDecorationDisabled
        tests:
          - SpdxToolTargets_DecorateSbom_SingleTfm_False_SkipsDecoration

      - id: SpdxToolTargets-SkipDecorationWithoutSbom
        title: The system shall skip SBOM decoration when GenerateSBOM is false.
        tags:
          - system
          - msbuild
          - sbom
        justification: |
          SBOM decoration depends on SBOM generation being enabled. When no SBOM
          is generated, decoration should be skipped entirely to avoid errors and
          unnecessary processing.
        children:
          - SpdxToolTargets-SingleTfm-SkipWhenGenerationDisabled
        tests:
          - SpdxToolTargets_GenerateSbom_SingleTfm_False_SkipsEntirely

      - id: SpdxToolTargets-SkipDecorationWhenNotPackable
        title: The system shall skip SBOM decoration when IsPackable is false.
        tags:
          - system
          - msbuild
          - sbom
        justification: |
          Projects with IsPackable=false do not produce a NuGet package, so SBOM
          decoration is not applicable. The target must exit cleanly in this scenario
          without attempting to invoke spdx-tool or requiring a workflow file.
        children:
          - SpdxToolTargets-SingleTfm-SkipWhenNotPackable
        tests:
          - SpdxToolTargets_DecorateSbom_SingleTfm_NotPackable_SkipsDecoration

      - id: SpdxToolTargets-ReportMissingWorkflowFile
        title: The system shall report a clear error when the workflow file is missing.
        tags:
          - system
          - msbuild
          - sbom
        justification: |
          When users enable SBOM decoration but the required workflow file is not
          present, they need a clear error message to understand the problem and
          take corrective action.
        children:
          - SpdxToolTargets-SingleTfm-ReportMissingWorkflow
        tests:
          - SpdxToolTargets_MissingWorkflow_SingleTfm_ReportsError

      - id: SpdxToolTargets-ConfigurableWorkflowFile
        title: The system shall allow the path of the SBOM decoration workflow file to be configured via the SpdxWorkflowFile
          MSBuild property.
        tags:
          - system
          - msbuild
          - sbom
        justification: |
          Users may need to use a custom workflow file name or location. The
          SpdxWorkflowFile property allows the workflow file path to be
          overridden from the default of spdx-workflow.yaml in the project
          directory.
        tests:
          - SpdxToolTargets_MissingWorkflow_SingleTfm_ReportsError

      - id: SpdxToolTargets-ConfigurableToolCommand
        title: The system shall allow the SpdxTool invocation command to be configured via the SpdxToolCommand MSBuild property.
        tags:
          - system
          - msbuild
          - sbom
        justification: |
          Users may install SpdxTool using a different invocation (e.g., a
          local tool or a wrapper script). The SpdxToolCommand property allows
          the command used to invoke the tool to be overridden from the default
          of dotnet spdx-tool.
        tests:
          - SpdxToolTargets_DecorateSbom_SingleTfm_True_DecoratesSbom
