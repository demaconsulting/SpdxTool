---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Utility Requirements
        requirements:
          - id: SpdxTool-Utility-SharedHelpers
            title: >-
              The Utility subsystem shall provide shared cross-cutting utilities for
              safe path operations and wildcard matching consumed by all commands.
            justification: |
              Command implementations that handle user-supplied file paths and filter SPDX content
              by name need shared utility functions. Centralizing these in the Utility subsystem
              ensures consistent path-traversal protection and pattern-matching behavior across all
              commands. This is an intentional rollup requirement; full decomposition is provided by
              the child requirements SpdxTool-Utility-PathHelpers and SpdxTool-Utility-Wildcard.
            children:
              - SpdxTool-Utility-RejectTraversal
              - SpdxTool-Utility-RejectAbsolutePath
              - SpdxTool-Utility-RejectNullArguments
              - SpdxTool-Utility-ValidPath
              - SpdxTool-Utility-Wildcard
              - SpdxTool-Utility-Wildcard-NullArgs
            tests:
              - PathHelpers_SafePathCombine_ValidPaths_CombinesCorrectly
              - PathHelpers_SafePathCombine_PathTraversalWithDoubleDots_ThrowsArgumentException
              - Wildcard_IsMatch_ExactMatch_MatchesCorrectly
