---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Utility Requirements
        sections:
          - title: Wildcard Requirements
            requirements:
              - id: SpdxTool-Utility-Wildcard
                title: The Wildcard unit shall match strings against glob-style wildcard patterns case-insensitively.
                tags:
                  - utility
                justification: |
                  Commands that filter SPDX content by name require wildcard matching that
                  is consistent across case-sensitive (Linux) and case-insensitive (Windows,
                  macOS) file systems.
                tests:
                  - Wildcard_IsMatch_ExactMatch_ReturnsTrue
                  - Wildcard_IsMatch_AsteriskPattern_MatchesMultipleChars
                  - Wildcard_IsMatch_QuestionMarkPattern_MatchesSingleChar
                  - Wildcard_IsMatch_EmptyInputs_BehavesCorrectly
              - id: SpdxTool-Utility-Wildcard-NullArgs
                title: >-
                  The Wildcard unit shall reject null pattern or input arguments with
                  an appropriate argument error.
                tags:
                  - utility
                justification: |
                  Defensive null-checking prevents unexpected failures from propagating to
                  callers and makes argument contract violations immediately visible.
                tests:
                  - Wildcard_IsMatch_NullInput_ThrowsArgumentNullException
                  - Wildcard_IsMatch_NullPattern_ThrowsArgumentNullException
