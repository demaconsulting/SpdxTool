---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Commands Requirements
        sections:
          - title: Query Requirements
            requirements:
              - id: SpdxTool-Commands-Query-ExternalProgramQuery
                title: The tool shall support querying external program output using the query command.
                tags:
                  - workflow
                justification: |
                  Workflows often need to extract information from external tools or
                  commands to incorporate into SPDX documents or workflow logic.
                tests:
                  - Query_Run_DotNetVersionOnCommandLine_ReturnsVersion
                  - Query_Run_DotNetVersionInWorkflow_StoresVersion

              - id: SpdxTool-Commands-Query-ValueCaptureGroup
                title: The tool shall require the regex pattern to contain a named value capture group.
                tags:
                  - workflow
                justification: |
                  The named capture group is the mechanism by which the tool extracts the
                  desired value from program output; patterns without it must be rejected.
                tests:
                  - Query_Run_PatternMissingValueGroup_ReportsError

              - id: SpdxTool-Commands-Query-CliOutput
                title: The tool shall write the captured value to the console when invoked from the CLI.
                tags:
                  - cli
                justification: |
                  Users running the query command from the command line need the captured
                  value written to standard output for scripting and inspection.
                tests:
                  - Query_Run_DotNetVersionOnCommandLine_ReturnsVersion

              - id: SpdxTool-Commands-Query-WorkflowOutput
                title: >-
                  The tool shall store the captured value in a named workflow variable
                  when invoked from a YAML step.
                tags:
                  - workflow
                justification: |
                  Workflows need to store extracted values for use in downstream steps;
                  the output input specifies the target variable.
                tests:
                  - Query_Run_DotNetVersionInWorkflow_StoresVersion

              - id: SpdxTool-Commands-Query-PatternNotFound
                title: The tool shall report an error when the pattern is not matched in any line of the program output.
                tags:
                  - workflow
                justification: |
                  When no line matches the pattern the requested value cannot be extracted;
                  the error must be reported clearly.
                tests:
                  - Query_Run_PatternNotFound_ReportsError

              - id: SpdxTool-Commands-Query-MissingArguments
                title: The tool shall report a usage error when the query command
                  is invoked with fewer than two CLI arguments.
                tags:
                  - cli
                justification: |
                  The query command requires at least a program argument and a pattern argument
                  to function. Missing arguments must be reported as a usage error with a clear
                  diagnostic message.
                tests:
                  - Query_Run_MissingArguments_ReportsError

              - id: SpdxTool-Commands-Query-InvalidProgram
                title: The tool shall report an error when the external program
                  specified in the query command cannot be started.
                tags:
                  - cli
                  - workflow
                justification: |
                  When the specified external program is not found or cannot be launched, the
                  error must be reported clearly so users can diagnose configuration problems.
                tests:
                  - Query_Run_InvalidProgram_ReportsError

              - id: SpdxTool-Commands-Query-InvalidRegexPattern
                title: >-
                  The tool shall report an error when the supplied regular expression
                  pattern is syntactically invalid.
                tags:
                  - workflow
                justification: |
                  A syntactically invalid pattern cannot be compiled and must be reported
                  as a usage error with a clear diagnostic message.
                tests:
                  - Query_Run_InvalidRegexPattern_ReportsError

              - id: SpdxTool-Commands-Query-MissingWorkflowInputs
                title: The tool shall report an error when a required workflow
                  input (output, pattern, or program) is absent from a query step.
                tags:
                  - workflow
                justification: |
                  Missing required inputs prevent the query command from executing and must be
                  reported clearly to prevent silent workflow failures and aid authors in
                  diagnosing configuration errors.
                tests:
                  - Query_Run_MissingWorkflowInputs_ReportsError
