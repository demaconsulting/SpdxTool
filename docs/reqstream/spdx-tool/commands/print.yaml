---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Commands Requirements
        sections:
          - title: Print Requirements
            requirements:
              - id: SpdxTool-Commands-Print-WorkflowOutput
                title: The tool shall support printing text within workflows using the print command.
                tags:
                  - workflow
                justification: |
                  Users need to output informational messages during workflow execution
                  for debugging, progress tracking, and user feedback.
                tests:
                  - Print_Run_InWorkflow_PrintsText

              - id: SpdxTool-Commands-Print-CliOutput
                title: The tool shall support printing text from the command line using the print command.
                tags:
                  - cli
                justification: |
                  Users need to print text directly from the command line as well as from
                  workflow steps for debugging and feedback purposes.
                tests:
                  - Print_Run_OnCommandLine_PrintsText

              - id: SpdxTool-Commands-Print-MissingTextInput
                title: >-
                  The tool shall report an error when the print command workflow step
                  is invoked without the text input.
                tags:
                  - workflow
                justification: |
                  The text input is required for the print command in workflow mode; its
                  absence must be reported clearly.
                tests:
                  - Print_Run_MissingTextInput_ThrowsYamlException

              - id: SpdxTool-Commands-Print-WorkflowVariableExpansion
                title: >-
                  The tool shall expand variable references in text lines of the print
                  command workflow step before writing them to output.
                tags:
                  - workflow
                justification: |
                  Variable expansion allows workflow authors to embed runtime values into
                  printed output, enabling dynamic status messages and diagnostic information.
                tests:
                  - Print_Run_InWorkflow_PrintsText
