---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Commands Requirements
        sections:
          - title: ToMarkdown Requirements
            requirements:
              - id: SpdxTool-Transform-ToMarkdown
                title: The tool shall convert SPDX documents to Markdown format using the to-markdown command.
                tags:
                  - spdx
                justification: |
                  Users need human-readable representations of SPDX documents for
                  documentation, reporting, and review purposes. Markdown is a widely
                  supported format for documentation.
                tests:
                  - ToMarkdown_Run_ValidSpdxFile_GeneratesMarkdown

              - id: SpdxTool-Transform-ToMarkdown-MissingArguments
                title: The to-markdown command shall report a usage error when required CLI arguments are missing.
                tags:
                  - spdx
                justification: |
                  Missing arguments indicate incorrect invocation. A clear error message
                  guides users to the correct command syntax.
                tests:
                  - ToMarkdown_Run_MissingArguments_ReportsError

              - id: SpdxTool-Transform-ToMarkdown-MissingSpdxFile
                title: The to-markdown command shall report an error when the specified SPDX file does not exist.
                tags:
                  - spdx
                justification: |
                  A missing input file cannot be processed. A clear error prevents confusing
                  output or silent failures.
                tests:
                  - ToMarkdown_Run_MissingSpdxFile_ReportsError

              - id: SpdxTool-Transform-ToMarkdown-WhitespaceTitle
                title: The to-markdown command shall reject a title that is empty or contains only whitespace.
                tags:
                  - spdx
                justification: |
                  A whitespace-only title produces a meaningless Markdown heading. Rejecting
                  it early provides a clear diagnostic and prevents invalid output.
                tests:
                  - ToMarkdown_Run_InvalidTitle_ReportsError

              - id: SpdxTool-Transform-ToMarkdown-NonPositiveDepth
                title: The to-markdown command shall reject a depth value that is not a positive integer.
                tags:
                  - spdx
                justification: |
                  A non-positive heading depth cannot produce valid Markdown headings.
                  Rejecting it prevents structurally invalid output.
                tests:
                  - ToMarkdown_Run_InvalidDepth_ReportsError
