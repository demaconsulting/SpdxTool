---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Commands Requirements
        sections:
          - title: Help Requirements
            requirements:
              - id: SpdxTool-Commands-Help-DisplayHelp
                title: >-
                  The help command shall display the extended usage information of the command
                  named by the about input of a workflow step.
                tags:
                  - cli
                justification: |
                  Workflow authors need access to detailed usage information for each command to
                  understand arguments, options, and workflow YAML syntax without consulting
                  external documentation. On the command line, the built-in help cards serve
                  this purpose.
                children:
                  - SpdxTool-Commands-Help-YamlInvocation
                  - SpdxTool-Commands-Help-CliRejection
                tests:
                  - Help_Run_YamlInvocation_DisplaysHelp
                  - Help_Run_UnknownCommand_ReportsError

              - id: SpdxTool-Commands-Help-YamlInvocation
                title: >-
                  The help command shall be invocable from a YAML workflow step using
                  the about input to specify the target command.
                tags:
                  - cli
                justification: |
                  Users running automated workflows need to retrieve help text programmatically
                  via the about input in YAML steps, not only from the command line.
                tests:
                  - Help_Run_YamlInvocation_DisplaysHelp
                  - Help_Run_YamlInvocation_MissingAbout_ReportsError

              - id: SpdxTool-Commands-Help-CliRejection
                title: The help command shall reject direct command-line invocation with a usage error.
                tags:
                  - cli
                justification: |
                  On the command line, 'spdx-tool help' as the first argument is answered by the
                  built-in help cards before the options are parsed. A help command that reaches the
                  command dispatcher after global options must not offer a second, different help.
                tests:
                  - Help_Run_OnCommandLine_ReportsWorkflowOnlyError
