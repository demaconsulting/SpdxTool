---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Commands Requirements
        sections:
          - title: UpdatePackage Requirements
            requirements:
              - id: SpdxTool-Package-UpdatePackage
                title: The tool shall update existing packages in SPDX documents using the update-package command.
                tags:
                  - spdx
                justification: |
                  Users need to modify package metadata as software components evolve,
                  such as updating versions, licenses, or other attributes.
                tests:
                  - UpdatePackage_Run_OnCommandLine_ReportsWorkflowOnlyError
                  - UpdatePackage_Run_InWorkflow_UpdatesPackage

              - id: SpdxTool-Package-UpdatePackage-CliRejection
                title: The update-package command shall reject direct CLI invocation with a usage error.
                tags:
                  - spdx
                justification: |
                  The update-package command requires workflow context to specify the SPDX
                  file and package fields. Rejecting CLI invocation prevents misuse and
                  provides a clear diagnostic.
                tests:
                  - UpdatePackage_Run_OnCommandLine_ReportsWorkflowOnlyError

              - id: SpdxTool-Package-UpdatePackage-MissingSpdxInput
                title: The update-package command shall report an error when the spdx input is missing.
                tags:
                  - spdx
                justification: |
                  The spdx input is required for the command to locate the SPDX document.
                  A clear error prevents silent failures.
                tests:
                  - UpdatePackage_Run_MissingSpdxInput_ReportsError

              - id: SpdxTool-Package-UpdatePackage-MissingPackageInput
                title: The update-package command shall report an error when the package input is missing.
                tags:
                  - spdx
                justification: |
                  The package input is required to identify the package to update.
                  A clear error prevents silent failures.
                tests:
                  - UpdatePackage_Run_MissingPackageInput_ReportsError

              - id: SpdxTool-Package-UpdatePackage-PackageNotFound
                title: >-
                  The update-package command shall report an error when the specified package
                  ID is not found in the SPDX document.
                tags:
                  - spdx
                justification: |
                  Attempting to update a non-existent package should fail clearly rather
                  than silently succeed, ensuring SPDX document integrity.
                tests:
                  - UpdatePackage_Run_PackageNotFound_ReportsError

              - id: SpdxTool-Package-UpdatePackage-PartialUpdate
                title: When only some fields are specified, unspecified fields shall remain unchanged.
                tags:
                  - spdx
                justification: |
                  Partial updates allow targeted metadata corrections without overwriting
                  other package attributes, preserving existing document content.
                tests:
                  - UpdatePackage_Run_PartialUpdate_PreservesUnspecifiedFields

              - id: SpdxTool-Package-UpdatePackage-MissingPackageIdInput
                title: >-
                  The update-package command shall report an error when the package id input
                  is absent from the package map.
                tags:
                  - spdx
                justification: |
                  The package id is required to locate the target package in the SPDX document.
                  A clear error when it is missing prevents ambiguous or incorrect updates.
                tests:
                  - UpdatePackage_Run_MissingPackageIdInput_ReportsError
