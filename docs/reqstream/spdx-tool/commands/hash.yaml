---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Commands Requirements
        sections:
          - title: Hash Requirements
            requirements:
              - id: SpdxTool-Hash-Generate
                title: The tool shall compute SHA-256 hashes for files and update the SPDX document.
                tags:
                  - spdx
                justification: |
                  Users need to generate SHA-256 hashes for files and record them in sidecar
                  files for later integrity verification.
                tests:
                  - Hash_GenerateOperation_UpdatesPackageHash

              - id: SpdxTool-Hash-Verify
                title: The tool shall verify file integrity against SHA-256 hashes stored in sidecar files.
                tags:
                  - spdx
                justification: |
                  Users need to verify that files match their recorded SHA-256 digests to
                  detect corruption or tampering.
                tests:
                  - Hash_VerifyOperation_SucceedsForValidHash
                  - Hash_VerifyOperation_FailsForInvalidHash

              - id: SpdxTool-Hash-MissingArguments
                title: The tool shall report a usage error when the hash command is invoked with insufficient arguments.
                tags:
                  - spdx
                justification: |
                  Users must provide the operation, algorithm, and file arguments; missing
                  arguments must be reported clearly.
                tests:
                  - Hash_MissingArguments_ReportsError

              - id: SpdxTool-Hash-MissingFile
                title: The tool shall report an error when the target file does not exist.
                tags:
                  - spdx
                justification: |
                  The hash command cannot operate on a non-existent file; an actionable error
                  message must be returned.
                tests:
                  - Hash_MissingFile_ReportsError

              - id: SpdxTool-Hash-UnsupportedAlgorithm
                title: The tool shall reject hash requests that specify an unsupported algorithm.
                tags:
                  - spdx
                justification: |
                  Only SHA-256 is currently supported; requests for other algorithms must
                  be rejected with a clear error.
                tests:
                  - Hash_UnsupportedAlgorithm_ReportsError

              - id: SpdxTool-Hash-InvalidOperation
                title: The tool shall reject hash requests that specify an unrecognized operation.
                tags:
                  - spdx
                justification: |
                  Only "generate" and "verify" are valid operations; unrecognized operations
                  must be rejected with a clear error.
                tests:
                  - Hash_InvalidOperation_ReportsError

              - id: SpdxTool-Hash-MissingSidecarFile
                title: The tool shall report an error when the sidecar hash file does not exist during verification.
                tags:
                  - spdx
                justification: |
                  Verification requires the sidecar .sha256 file to be present; its absence
                  must be reported clearly.
                tests:
                  - Hash_VerifyMissingFile_ReportsError
