---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Commands Requirements
        sections:
          - title: Hash Requirements
            requirements:
              - id: SpdxTool-Commands-Hash-Generate
                title: The tool shall generate a SHA-256 sidecar file for the specified file.
                tags:
                  - spdx
                justification: |
                  Users need to generate SHA-256 hashes for files and record them in sidecar
                  files for later integrity verification.
                tests:
                  - Hash_Run_GenerateOperation_WritesSidecarFile

              - id: SpdxTool-Commands-Hash-Verify
                title: The tool shall verify file integrity against SHA-256 hashes stored in sidecar files.
                tags:
                  - spdx
                justification: |
                  Users need to verify that files match their recorded SHA-256 digests to
                  detect corruption or tampering.
                tests:
                  - Hash_Run_VerifyOperation_SucceedsForValidHash
                  - Hash_Run_VerifyOperation_FailsForInvalidHash

              - id: SpdxTool-Commands-Hash-VerifyCaseInsensitive
                title: The tool shall accept sidecar hash files whose digest is stored
                  in any combination of upper- and lowercase hexadecimal characters.
                tags:
                  - spdx
                justification: |
                  External tools may produce sidecar files with uppercase hex digits;
                  case-insensitive comparison ensures interoperability.
                tests:
                  - Hash_Run_VerifyUppercaseDigest_Succeeds

              - id: SpdxTool-Commands-Hash-MissingArguments
                title: >-
                  The tool shall report a usage error when the hash command is invoked
                  with any argument count other than exactly three (operation, algorithm, file).
                tags:
                  - spdx
                justification: |
                  Users must provide exactly the operation, algorithm, and file arguments; both
                  too few and too many arguments must be reported clearly.
                tests:
                  - Hash_Run_MissingArguments_ReportsError
                  - Hash_Run_ExcessArguments_ReportsError

              - id: SpdxTool-Commands-Hash-MissingFile
                title: The tool shall report an error when the file to be hashed does not exist.
                tags:
                  - spdx
                justification: |
                  The hash command cannot operate on a non-existent file; an actionable error
                  message must be returned.
                tests:
                  - Hash_Run_MissingFile_ReportsError

              - id: SpdxTool-Commands-Hash-UnsupportedAlgorithm
                title: The tool shall reject hash requests that specify an unsupported algorithm.
                tags:
                  - spdx
                justification: |
                  Only SHA-256 is currently supported; requests for other algorithms must
                  be rejected with a clear error.
                tests:
                  - Hash_Run_UnsupportedAlgorithm_ReportsError

              - id: SpdxTool-Commands-Hash-InvalidOperation
                title: The tool shall reject hash requests that specify an unrecognized operation.
                tags:
                  - spdx
                justification: |
                  Only "generate" and "verify" are valid operations; unrecognized operations
                  must be rejected with a clear error.
                tests:
                  - Hash_Run_InvalidOperation_ReportsError

              - id: SpdxTool-Commands-Hash-MissingSidecarFile
                title: The tool shall report an error when the sidecar hash file does not exist during verification.
                tags:
                  - spdx
                justification: |
                  Verification requires the sidecar .sha256 file to be present; its absence
                  must be reported clearly.
                tests:
                  - Hash_Run_VerifyMissingSidecarFile_ReportsError

              - id: SpdxTool-Commands-Hash-MissingTargetFile
                title: The tool shall report an error when the target file does not exist during verification.
                tags:
                  - spdx
                justification: |
                  Verification cannot proceed if the target file is absent even when the
                  sidecar is present; a clear error must be reported.
                tests:
                  - Hash_Run_VerifyTargetMissing_ReportsError

              - id: SpdxTool-Commands-Hash-WorkflowInvocation
                title: The tool shall support hash command invocation from a workflow YAML step.
                tags:
                  - spdx
                justification: |
                  Workflow users must be able to generate and verify hashes via YAML step
                  configuration.
                tests:
                  - Hash_Run_InWorkflow_GeneratesHash

              - id: SpdxTool-Commands-Hash-WorkflowMissingOperation
                title: The tool shall report an error when the operation input is missing from a workflow hash step.
                tags:
                  - spdx
                justification: |
                  Missing required inputs must be reported clearly to prevent silent workflow
                  failures.
                tests:
                  - Hash_Run_InWorkflow_MissingOperation_ReportsError

              - id: SpdxTool-Commands-Hash-WorkflowMissingAlgorithm
                title: The tool shall report an error when the algorithm input is missing from a workflow hash step.
                tags:
                  - spdx
                justification: |
                  Missing required inputs must be reported clearly to prevent silent workflow
                  failures.
                tests:
                  - Hash_Run_InWorkflow_MissingAlgorithm_ReportsError

              - id: SpdxTool-Commands-Hash-WorkflowMissingFile
                title: The tool shall report an error when the file input is missing from a workflow hash step.
                tags:
                  - spdx
                justification: |
                  Missing required inputs must be reported clearly to prevent silent workflow
                  failures.
                tests:
                  - Hash_Run_InWorkflow_MissingFile_ReportsError
