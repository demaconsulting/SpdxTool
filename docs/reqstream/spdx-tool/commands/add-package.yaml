---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Commands Requirements
        sections:
          - title: AddPackage Requirements
            requirements:
              - id: SpdxTool-Commands-AddPackage
                title: The tool shall add packages to SPDX documents using the add-package command.
                tags:
                  - spdx
                justification: |
                  Users need to incrementally build SPDX documents by adding new packages
                  that represent software components, libraries, or dependencies.
                tests:
                  - AddPackage_Run_InWorkflowWithRelationship_AddsPackageAndRelationship
                  - AddPackage_Run_InWorkflowNoRelationship_AddsPackageOnly
                  - AddPackage_Run_InWorkflowWithQueryVersion_AddsPackage

              - id: SpdxTool-Commands-AddPackage-WorkflowOnly
                title: >-
                  The add-package command shall only be available in workflow mode; direct CLI invocation
                  shall be rejected with a usage error.
                tags:
                  - spdx
                justification: |
                  The add-package command requires workflow context to provide structured
                  package data via YAML inputs. Direct CLI invocation cannot supply the
                  necessary structured input.
                tests:
                  - AddPackage_Run_OnCommandLine_ReportsWorkflowOnlyError

              - id: SpdxTool-Commands-AddPackage-Enhance
                title: >-
                  When a package with the same identity already exists in the target SPDX document,
                  the add-package command shall enhance the existing package rather than adding a duplicate.
                tags:
                  - spdx
                justification: |
                  Users may run add-package multiple times with the same package identity.
                  Enhancing rather than duplicating ensures SPDX document consistency and
                  avoids invalid documents with duplicate package entries.
                tests:
                  - AddPackage_Run_InWorkflowWithExistingPackage_EnhancesPackage

              - id: SpdxTool-Commands-AddPackage-ValidateMissingSpdxInput
                title: The add-package command shall report an error when the spdx input is missing.
                tags:
                  - spdx
                justification: |
                  Invalid inputs must be detected early and reported clearly so that workflow
                  authors can diagnose configuration mistakes quickly.
                tests:
                  - AddPackage_Run_InWorkflowMissingSpdxInput_ReportsError

              - id: SpdxTool-Commands-AddPackage-ValidateMissingPackageInput
                title: The add-package command shall report an error when the package input is missing.
                tags:
                  - spdx
                justification: |
                  Invalid inputs must be detected early and reported clearly so that workflow
                  authors can diagnose configuration mistakes quickly.
                tests:
                  - AddPackage_Run_InWorkflowMissingPackageInput_ReportsError

              - id: SpdxTool-Commands-AddPackage-ValidateMissingId
                title: >-
                  The add-package command shall report a usage error when the required package id
                  field is absent.
                tags:
                  - spdx
                justification: |
                  Invalid package field values must be detected early and reported clearly so
                  that workflow authors can diagnose configuration mistakes quickly.
                tests:
                  - AddPackage_ParsePackage_MissingPackageId_ReportsError

              - id: SpdxTool-Commands-AddPackage-ValidateMissingName
                title: >-
                  The add-package command shall report a usage error when the required package name
                  field is absent.
                tags:
                  - spdx
                justification: |
                  Invalid package field values must be detected early and reported clearly so
                  that workflow authors can diagnose configuration mistakes quickly.
                tests:
                  - AddPackage_ParsePackage_MissingPackageName_ReportsError

              - id: SpdxTool-Commands-AddPackage-ValidateMissingDownload
                title: >-
                  The add-package command shall report a usage error when the required package
                  download field is absent.
                tags:
                  - spdx
                justification: |
                  Invalid package field values must be detected early and reported clearly so
                  that workflow authors can diagnose configuration mistakes quickly.
                tests:
                  - AddPackage_ParsePackage_MissingPackageDownload_ReportsError

              - id: SpdxTool-Commands-AddPackage-ValidateEmptyId
                title: >-
                  The add-package command shall report a usage error when the package id field is
                  present but empty.
                tags:
                  - spdx
                justification: |
                  Invalid package field values must be detected early and reported clearly so
                  that workflow authors can diagnose configuration mistakes quickly.
                tests:
                  - AddPackage_Run_InWorkflowWithEmptyPackageId_ReportsError

              - id: SpdxTool-Commands-AddPackage-ValidateReservedId
                title: >-
                  The add-package command shall report a usage error when the package id is the
                  reserved value SPDXRef-DOCUMENT.
                tags:
                  - spdx
                justification: |
                  Invalid package field values must be detected early and reported clearly so
                  that workflow authors can diagnose configuration mistakes quickly.
                tests:
                  - AddPackage_Run_InWorkflowWithDocumentPackageId_ReportsError
