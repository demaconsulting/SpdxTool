---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Commands Requirements
        sections:
          - title: AddRelationship Requirements
            requirements:
              - id: SpdxTool-Relationship-AddRelationship
                title: The tool shall add relationships to SPDX documents using the add-relationship command.
                tags:
                  - spdx
                justification: |
                  SPDX documents describe relationships between packages, files, and other
                  elements. Users need to define these relationships to accurately represent
                  dependency graphs and component hierarchies.
                tests:
                  - AddRelationship_Run_OnCommandLine_AddsRelationship
                  - AddRelationship_InWorkflow_AddsRelationship
                  - AddRelationship_ReplaceMode_ReplacesExistingRelationship

              - id: SpdxTool-Relationship-AddRelationship-Validate
                title: >-
                  The add-relationship command shall validate its workflow inputs and report an error for
                  missing or invalid values.
                tags:
                  - spdx
                justification: |
                  Invalid inputs must be detected early and reported clearly so that workflow
                  authors can diagnose configuration mistakes quickly.
                tests:
                  - AddRelationship_InWorkflowMissingSpdxInput_ReportsError
                  - AddRelationship_InWorkflowMissingIdInput_ReportsError
                  - AddRelationship_InWorkflowMissingRelationshipsInput_ReportsError
                  - AddRelationship_InWorkflowInvalidReplaceValue_ReportsError
                  - AddRelationship_InWorkflowNonMappingRelationshipNode_ReportsError
                  - AddRelationship_InWorkflowMissingRelationshipType_ReportsError
                  - AddRelationship_InWorkflowMissingRelationshipElement_ReportsError

              - id: SpdxTool-Relationship-AddRelationship-Validate-CLI
                title: >-
                  The add-relationship command shall validate CLI arguments and report an error for
                  missing or invalid values.
                tags:
                  - spdx
                justification: |
                  Invalid command-line inputs must be detected early and reported clearly so that
                  users can diagnose configuration mistakes quickly.
                tests:
                  - AddRelationship_Run_MissingArguments_ReportsError
                  - AddRelationship_Run_MissingFile_ReportsError
