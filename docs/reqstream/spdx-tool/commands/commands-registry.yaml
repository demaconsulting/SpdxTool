---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Commands Requirements
        sections:
          - title: CommandRegistry Requirements
            requirements:
              - id: SpdxTool-CommandRegistry-Lookup
                title: CommandsRegistry shall provide a named lookup of all registered commands.
                justification: |
                  Named lookup enables Program and RunWorkflow to dispatch commands by the name
                  string provided by the user or workflow author.
                tests:
                  - Commands_Dispatch_UnknownCommand_ReportsError
                  - Command_Expand_NoVariables_ReturnsOriginal
                  - CommandsRegistry_Commands_AllExpectedNames_ArePresent
                  - CommandsRegistry_Commands_KnownCommandName_ResolvesEntry
