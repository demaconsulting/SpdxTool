---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Command-Line Interface
        requirements:
          - id: SpdxTool-Command-Version
            title: The tool shall display version information when invoked with the -v or --version flag.
            tags:
              - cli
            justification: |
              Users need to check the version of the tool they are using for compatibility
              and troubleshooting purposes.
            tests:
              - SpdxTool_Version_ShortFlag_DisplaysVersion
              - SpdxTool_Version_LongFlag_DisplaysVersion

          - id: SpdxTool-Command-Help
            title: The tool shall display usage information when invoked with the -h, -?, or --help flag.
            tags:
              - cli
            justification: |
              Users need quick access to help documentation to understand how to use the
              tool effectively.
            tests:
              - SpdxTool_Usage_ShortHelpFlag_DisplaysUsage
              - SpdxTool_Usage_LongHelpFlag_DisplaysUsage
              - SpdxTool_Usage_QuestionMarkHelpFlag_DisplaysUsage

          - id: SpdxTool-Command-InvalidArgs
            title: The tool shall display an error and usage information when invoked without arguments.
            tags:
              - cli
            justification: |
              When users invoke the tool without any arguments, they should receive
              guidance on proper usage rather than encountering undefined behavior.
            tests:
              - SpdxTool_Usage_NoArguments_DisplaysError

          - id: SpdxTool-Command-Silent
            title: The tool shall silence console output when invoked with the -s or --silent flag.
            tags:
              - cli
            justification: |
              In automated scripts and CI/CD pipelines, users may want to suppress
              console output to reduce log noise.
            tests:
              - SpdxTool_Silent_ShortFlag_SuppressesOutput
              - SpdxTool_Silent_LongFlag_SuppressesOutput

          - id: SpdxTool-Command-Log
            title: The tool shall write output to a log file when invoked with the -l or --log flag.
            tags:
              - cli
            justification: |
              Users need the ability to capture tool output to files for auditing,
              debugging, and record-keeping purposes.
            tests:
              - SpdxTool_Log_ShortFlag_WritesOutputToFile
              - SpdxTool_Log_LongFlag_WritesOutputToFile

          - id: SpdxTool-Command-Validate
            title: The tool shall perform self-validation when invoked with the --validate flag.
            tags:
              - cli
            justification: |
              Self-validation ensures that the tool functions correctly after installation
              or deployment. This is critical for CI/CD pipelines and quality assurance.
            children:
              - SpdxTool-SelfTest-Validate
            tests:
              - SpdxTool_SelfTest_ValidateFlag_Succeeds

          - id: SpdxTool-Command-Depth
            title: The tool shall support depth control for self-validation output.
            tags:
              - cli
            justification: |
              Users may want to see detailed hierarchical results during self-validation
              to understand which specific tests passed or failed at different depths.
            children:
              - SpdxTool-SelfTest-Depth
            tests:
              - SpdxTool_SelfTest_ValidateFlagWithDepth_ShowsDepth

          - id: SpdxTool-Command-ResultsTrx
            title: The tool shall write self-validation results as TRX when the --result flag uses a .trx extension.
            tags:
              - cli
            justification: |
              CI/CD systems and test reporting tools often require test results in
              standardized formats like TRX. This enables integration with existing
              test infrastructure.
            children:
              - SpdxTool-SelfTest-ResultsTrx
            tests:
              - SpdxTool_SelfTest_ValidateFlagWithResults_GeneratesTrxFile

          - id: SpdxTool-Command-ResultsJUnit
            title: The tool shall write self-validation results as JUnit XML when the --result flag uses .xml extension.
            tags:
              - cli
            justification: |
              Many CI/CD systems and test reporting tools support JUnit XML format.
              Auto-detecting the format from the file extension allows users to generate
              JUnit output without requiring a separate flag.
            children:
              - SpdxTool-SelfTest-ResultsJUnit
            tests:
              - SpdxTool_SelfTest_ValidateFlagWithResults_GeneratesJUnitFile

          - id: SpdxTool-Command-ResultShortFlag
            title: The tool shall accept -r as an alias for the --result flag.
            tags:
              - cli
            justification: |
              Short flag aliases improve usability in scripts and interactive sessions where
              brevity is preferred. The -r alias must be functionally identical to --result.
            tests:
              - SpdxTool_SelfTest_ValidateFlagWithResults_ShortFlag_GeneratesTrxFile

      - title: Command Execution
        requirements:
          - id: SpdxTool-CommandExecution-SupportedCommands
            title: >-
              The tool shall support SPDX document manipulation commands including
              add-package, add-relationship, copy-package, diagram, find-package,
              get-version, hash, help, print, query, rename-id, run-workflow,
              set-variable, to-markdown, update-package, and validate.
            tags:
              - commands
            justification: |
              The tool's core value is the set of SPDX manipulation commands it provides.
              Each command must be reachable by name from the command-line dispatcher so
              that users can invoke them in scripts and CI/CD pipelines.
            children:
              - SpdxTool-Package-AddPackage
              - SpdxTool-Relationship-AddRelationship
              - SpdxTool-Commands-CopyPackage
              - SpdxTool-Transform-Diagram
              - SpdxTool-Commands-FindPackage
              - SpdxTool-Commands-GetVersion-RetrievePackageVersion
              - SpdxTool-Commands-Hash-Generate
              - SpdxTool-Commands-Help-DisplayHelp
              - SpdxTool-Commands-Print-WorkflowOutput
              - SpdxTool-Commands-Query-ExternalProgramQuery
              - SpdxTool-Commands-RenameId
              - SpdxTool-Commands-RunWorkflow
              - SpdxTool-Commands-SetVariable
              - SpdxTool-Commands-ToMarkdown
              - SpdxTool-Commands-UpdatePackage
              - SpdxTool-Commands-Validate-Validate
            tests:
              - SpdxTool_Usage_NoArguments_DisplaysError

          - id: SpdxTool-CommandExecution-WorkflowExecution
            title: The tool shall execute SPDX manipulation workflows defined in YAML workflow files.
            tags:
              - commands
              - workflow
            justification: |
              Workflows allow users to compose multiple SPDX tool commands into a single
              repeatable operation. This is the primary integration mechanism for CI/CD
              pipelines and MSBuild targets.
            children:
              - SpdxTool-Commands-RunWorkflow
            tests:
              - RunWorkflow_Run_ValidWorkflowFile_ExecutesWorkflow

      - title: Platform Support
        requirements:
          - id: SpdxTool-Platform-CrossPlatform
            title: The tool shall run successfully on Windows, Linux, and macOS platforms.
            tags:
              - platform
            justification: |
              Supporting multiple operating systems ensures the tool is usable across the
              full range of developer and CI/CD environments. Both the dotnet-tool and the
              MSBuild targets package must function correctly on all three platforms.
            children:
              - SpdxTool-Platform-Windows
              - SpdxTool-Platform-Linux
              - SpdxTool-Platform-MacOS
            tests:
              - windows@SpdxTool_Basic
              - ubuntu@SpdxTool_Basic
              - macos@SpdxTool_Basic

          - id: SpdxTool-Platform-MultiFramework
            title: The tool shall run on .NET 8, .NET 9, and .NET 10.
            tags:
              - platform
            justification: |
              Supporting multiple active .NET LTS and STS releases ensures the tool
              remains usable as users upgrade their projects and CI/CD environments.
            children:
              - SpdxTool-Platform-Net8
              - SpdxTool-Platform-Net9
              - SpdxTool-Platform-Net10
            # net8.0@/net9.0@/net10.0@ prefixes are TFM (target framework moniker) CI dimensions
            # reflecting the compiled TFM of the test assembly. The dotnet8.x@/dotnet9.x@/dotnet10.x@
            # prefixes used in child requirements are installed SDK version CI dimensions.
            tests:
              - net9.0@SpdxTool_Version_ShortFlag_DisplaysVersion
              - net10.0@SpdxTool_Version_ShortFlag_DisplaysVersion
