---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: SelfTest Requirements
        sections:
          - title: ValidateBasic Requirements
            requirements:
              - id: SpdxTool-SelfTest-Basic
                title: The ValidateBasic unit shall verify basic SpdxTool validation behavior.
                tags:
                  - self-test
                justification: |
                  Self-validation of basic tool functionality ensures the core CLI flags
                  (silent mode, logging) work correctly with the validate command
                  after installation or deployment.
                children:
                  - SpdxTool-SelfTest-Basic-ValidAccepted
                  - SpdxTool-SelfTest-Basic-InvalidRejected
                tests:
                  - SpdxTool_Basic

              - id: SpdxTool-SelfTest-Basic-ValidAccepted
                title: >-
                  The ValidateBasic unit shall verify that the validate command accepts a
                  well-formed SPDX document.
                tags:
                  - self-test
                justification: |
                  Self-validation of basic tool functionality ensures the core CLI flags
                  (silent mode, logging) work correctly with the validate command
                  after installation or deployment.
                tests:
                  - SpdxTool_Basic

              - id: SpdxTool-SelfTest-Basic-InvalidRejected
                title: >-
                  The ValidateBasic unit shall verify that the validate command rejects a
                  malformed SPDX document.
                tags:
                  - self-test
                justification: |
                  Confirming that the validate command correctly reports errors for invalid
                  SPDX content ensures that users can trust validation results when building
                  compliance workflows.
                tests:
                  - SpdxTool_Basic
