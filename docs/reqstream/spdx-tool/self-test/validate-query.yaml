---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: SelfTest Requirements
        sections:
          - title: ValidateQuery Requirements
            requirements:
              - id: SpdxTool-SelfTest-Query
                title: The SelfTest shall exercise the query command.
                tags:
                  - self-test
                justification: |
                  Self-validation of the query command ensures it correctly executes
                  external programs and extracts values from their output after installation
                  or deployment.
                tests:
                  - ValidateQuery_Run_ValidQueryWorkflow_Passes
                  - ValidateQuery_Run_IoError_PropagatesException
