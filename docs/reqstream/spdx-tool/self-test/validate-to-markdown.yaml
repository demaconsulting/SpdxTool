---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: SelfTest Requirements
        sections:
          - title: ValidateToMarkdown Requirements
            requirements:
              - id: SpdxTool-SelfTest-ToMarkdown
                title: The SelfTest shall exercise the to-markdown command.
                tags:
                  - self-test
                justification: |
                  Self-validation of the to-markdown command ensures it correctly generates
                  Markdown summaries of SPDX documents after installation or deployment.
                tests:
                  - ValidateToMarkdown_Run_ValidToMarkdownWorkflow_Passes
                  - ValidateToMarkdown_Run_IoError_PropagatesException
