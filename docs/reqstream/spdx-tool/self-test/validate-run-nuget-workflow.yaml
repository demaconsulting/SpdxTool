---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: SelfTest Requirements
        sections:
          - title: ValidateRunNuGetWorkflow Requirements
            requirements:
              - id: SpdxTool-SelfTest-RunNuGetWorkflow
                title: The SelfTest shall exercise the run-workflow command with NuGet packages.
                tags:
                  - self-test
                justification: |
                  Self-validation of NuGet workflow execution ensures the run-workflow command
                  correctly resolves workflow files from NuGet packages and executes them
                  after installation or deployment.
                tests:
                  - ValidateRunNuGetWorkflow_Run_ValidNuGetWorkflow_Passes
                  - ValidateRunNuGetWorkflow_Run_IoError_PropagatesException
