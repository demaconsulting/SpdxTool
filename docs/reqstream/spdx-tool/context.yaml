---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Context Requirements
        requirements:
          - id: SpdxTool-Context-FlagState
            title: >-
              Context shall preserve parsed global flag values (Silent, Help, Version, Validate) for
              the duration of a single tool invocation.
            justification: |
              Storing parsed flag values in Context enables all commands and subsystems to share a
              consistent view of global options without re-parsing the command line. Explicit state
              passing makes commands independently testable.
            tests:
              - Context_Create_SilentFlag_SetsSilentToTrue
              - Context_Create_WithDepthFlag_SetsDepth
              - Context_Create_NoDepthFlag_DefaultsDepthToOne
          - id: SpdxTool-Context-CommandArguments
            title: >-
              Context shall expose the remaining command-line tokens after global flags have been parsed.
            justification: |
              Command implementations require access to their positional arguments. Context collects
              all tokens following the last recognized global flag and exposes them via the Arguments
              property, enabling the dispatch layer to forward the correct arguments to each command.
          - id: SpdxTool-Context-OutputChannels
            title: >-
              Context shall route WriteLine, WriteWarning, and WriteError calls to the console and
              log file according to the Silent flag and log configuration.
            justification: |
              Centralizing output routing in Context ensures consistent behavior across all commands:
              Silent mode suppresses console output while still capturing to the log, and every output
              channel (line, warning, error) writes to the log when configured.
            tests:
              - Context_WriteLine_WithLogFile_WritesLineToFile
              - Context_WriteWarning_DoesNotIncrementErrors
          - id: SpdxTool-Context-ErrorStatus
            title: >-
              Context shall make accumulated error state available via the Errors and ExitCode properties.
            justification: |
              Exposing error state through Context properties enables Program to determine the process
              exit code after all commands complete. The ExitCode property translates the Errors counter
              into a binary process result, ensuring CI pipelines detect any failures.
            tests:
              - Context_WriteError_SingleCall_IncrementsErrorCount
          - id: SpdxTool-Context-ErrorCount
            title: The tool shall reflect whether any errors occurred during invocation via the process exit code.
            justification: |
              Error counting enables the process exit code to reflect whether any errors occurred
              during the invocation, which is essential for CI/CD pipeline integration.
            tests:
              - Context_WriteError_SingleCall_IncrementsErrorCount
          - id: SpdxTool-Context-LogOutput
            title: Context shall write output to a log file when the -l/--log flag is supplied.
            justification: |
              CI pipelines and automated workflows sometimes need a persistent record of
              tool output independent of the terminal. The --log flag creates a file writer
              in Context that receives every WriteLine/WriteWarning/WriteError call, even
              when --silent is also active.
            tests:
              - SpdxTool_Log_ShortFlag_WritesOutputToFile
              - SpdxTool_Log_LongFlag_WritesOutputToFile
              - SpdxTool_Log_SilentFlag_WritesToLogButNotConsole
          - id: SpdxTool-Context-DefaultDepth
            title: Context shall default the depth to 1 when the --depth flag is not specified.
            justification: |
              A default depth of 1 provides sensible output for typical invocations without
              requiring explicit configuration. This default is an observable behavior that
              affects SelfTest output and must be specified to ensure consistent tool behavior.
            tests:
              - Context_Create_NoDepthFlag_DefaultsDepthToOne
          - id: SpdxTool-Context-InvalidDepthRejection
            title: The tool shall reject a negative integer value for the `--depth` flag and report an error.
            justification: |
              A negative depth value is nonsensical and would cause undefined behavior in output
              formatting. Rejecting it immediately with a clear error prevents confusing tool
              behavior and gives users actionable feedback.
            tests:
              - Context_Create_NegativeDepth_ThrowsInvalidOperationException
          - id: SpdxTool-Context-InvalidLogFileRejection
            title: The tool shall reject an invalid or inaccessible log file path and report an error.
            justification: |
              Silently failing to open a log file would leave users without the expected
              persistent record without any indication of the problem. Rejecting the invalid
              path immediately ensures users detect configuration mistakes during invocation.
            tests:
              - Context_Create_InvalidLogFilePath_ThrowsInvalidOperationException
