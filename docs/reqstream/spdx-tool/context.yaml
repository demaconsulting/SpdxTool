---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Context Requirements
        requirements:
          - id: SpdxTool-Context-ExecutionState
            title: >-
              Context shall make parsed global flags, command arguments, output channels, and error status
              available to all commands for the duration of a single tool invocation.
            justification: |
              Centralizing execution state in Context enables all commands and subsystems to
              share a consistent view of flag values, output channels, and error counts without
              using global variables. Explicit state passing makes commands independently testable.
            tests:
              - SpdxTool_Version_ShortFlag_DisplaysVersion
              - SpdxTool_Silent_ShortFlag_SuppressesOutput
              - SpdxTool_Usage_NoArguments_DisplaysError
          - id: SpdxTool-Context-ErrorCount
            title: The tool shall reflect whether any errors occurred during invocation via the process exit code.
            justification: |
              Error counting enables the process exit code to reflect whether any errors occurred
              during the invocation, which is essential for CI/CD pipeline integration.
            tests:
              - SpdxTool_Usage_NoArguments_DisplaysError
          - id: SpdxTool-Context-LogOutput
            title: Context shall write output to a log file when the -l/--log flag is supplied.
            justification: |
              CI pipelines and automated workflows sometimes need a persistent record of
              tool output independent of the terminal. The --log flag creates a file writer
              in Context that receives every WriteLine/WriteWarning/WriteError call, even
              when --silent is also active.
            tests:
              - SpdxTool_Log_ShortFlag_WritesOutputToFile
              - SpdxTool_Log_LongFlag_WritesOutputToFile
              - SpdxTool_Log_SilentFlag_WritesToLogButNotConsole
          - id: SpdxTool-Context-DefaultDepth
            title: Context shall default the depth to 1 when the --depth flag is not specified.
            justification: |
              A default depth of 1 provides sensible output for typical invocations without
              requiring explicit configuration. This default is an observable behavior that
              affects SelfTest output and must be specified to ensure consistent tool behavior.
            tests:
              - SpdxTool_Version_ShortFlag_DisplaysVersion
