---
sections:
  - title: SpdxTool Requirements
    sections:
      - title: Program Requirements
        requirements:
          - id: SpdxTool-Program-CLIFlagAcceptance
            title: >-
              The tool shall accept and parse global command-line flags including
              -h, -v, -s, -l, --validate, -r, and --depth.
            justification: |
              Global flags control tool behavior before any command runs. Each flag must be
              recognized and processed so that all invocation modes (help, version, silent,
              logging, self-validation) are accessible to users.
            children:
              - SpdxTool-Context-FlagState
              - SpdxTool-Context-DefaultDepth
              - SpdxTool-Context-InvalidDepthRejection
              - SpdxTool-Context-InvalidLogFileRejection
            tests:
              - SpdxTool_Version_ShortFlag_DisplaysVersion
              - SpdxTool_Usage_ShortHelpFlag_DisplaysUsage
              - SpdxTool_Silent_ShortFlag_SuppressesOutput
          - id: SpdxTool-Program-CommandDispatch
            title: >-
              The tool shall dispatch to the command matching the first positional
              argument and report an error for unrecognized commands.
            justification: |
              Program is the application entry point and must correctly route every invocation
              to the right handler based on the command name that follows the global flags.
            children:
              - SpdxTool-Context-CommandArguments
              - SpdxTool-Commands-Dispatch
            tests:
              - SpdxTool_Usage_NoArguments_DisplaysError
              - Commands_Dispatch_UnknownCommand_ReportsError
          - id: SpdxTool-Program-HelpCommand
            title: >-
              The tool shall answer the help command before the command-line options are
              parsed and return its exit code.
            justification: |
              The help command must be answered without the banner and without the global options,
              so that its output is the same for people, scripts, and AI agents. Offering the
              arguments to the help command first lets spdx-tool help work while every other run
              continues to the option parser unchanged.
            tests:
              - Program_Main_HelpVerb_PrintsHelpIndex
          - id: SpdxTool-Program-HelpFooter
            title: The tool shall end its usage information with a pointer to the help command.
            justification: |
              The short usage text stays short and still tells a reader where the help topics with
              worked examples are.
            tests:
              - SpdxTool_Program_Run_HelpContext_WritesUsage
          - id: SpdxTool-Program-NonZeroExitOnFailure
            title: The tool shall exit with a non-zero exit code when any error is recorded during execution.
            justification: |
              A non-zero exit code on failure is the standard contract for CLI tools and is
              essential for CI/CD pipelines and scripts to detect and react to failures.
            children:
              - SpdxTool-Context-ErrorStatus
              - SpdxTool-Context-ErrorCount
            tests:
              - SpdxTool_Usage_NoArguments_DisplaysError
