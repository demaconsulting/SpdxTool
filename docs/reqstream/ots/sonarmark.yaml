---
# SonarMark OTS requirements
sections:
  - title: OTS Software Requirements
    sections:
      - title: SonarMark Requirements
        requirements:
          - id: SpdxTool-OTS-SonarMark
            title: SonarMark shall be installed and invocable in the pipeline environment.
            tags:
              - ots
            justification: |
              DemaConsulting.SonarMark is a CI pipeline tool that generates a SonarCloud quality report.
              The linked test verifies installation only: it invokes sonarmark to confirm the tool is
              present and responds correctly. Full functional verification of SonarCloud metric retrieval
              and markdown report generation occurs through CI pipeline execution, where the presence of
              the quality report artifact in each release provides observable evidence of correct operation.
            tests:
              - SonarMark_Tool_IsInstalled

          - id: SpdxTool-OTS-SonarMark-ApiQuery
            title: SonarMark shall query the SonarCloud REST API to retrieve quality-gate and metrics data.
            tags:
              - ots
              - ci-pipeline-verified
            justification: |
              SonarMark calls the SonarCloud REST API to retrieve quality-gate status, coverage percentage,
              code duplications, and other metric values for the project. This capability is exercised on
              every pipeline run and verified by the presence of the quality report artifact in the release
              bundle. See the OTS CI-Pipeline Exception in requirements-principles.md.

          - id: SpdxTool-OTS-SonarMark-MarkdownReport
            title: SonarMark shall render retrieved metrics and quality-gate verdict as a structured markdown document.
            tags:
              - ots
              - ci-pipeline-verified
            justification: |-
              SonarMark produces a markdown quality report from the data it retrieves from SonarCloud.
              Full functional verification occurs through CI pipeline execution, where the quality report
              artifact in each release provides observable evidence that markdown generation operated
              correctly. See the OTS CI-Pipeline Exception in requirements-principles.md.
