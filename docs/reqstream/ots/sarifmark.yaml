---
# SarifMark OTS requirements
sections:
  - title: OTS Software Requirements
    sections:
      - title: SarifMark Requirements
        requirements:
          - id: SpdxTool-OTS-SarifMark
            title: SarifMark shall be installed and invocable in the pipeline environment.
            tags:
              - ots
            justification: |
              DemaConsulting.SarifMark is a CI pipeline tool that converts CodeQL SARIF results into a
              markdown report. The linked tests verify installation only: they invoke sarifmark to confirm
              the tool is present and responds correctly. Full functional verification of SARIF reading
              and markdown report generation occurs through CI pipeline execution, where the presence of
              the SARIF report artifact in each release provides observable evidence of correct operation.
            tests:
              - SarifMark_Tool_IsInstalled
              - SarifMark_Tool_ReportsVersion

          - id: SpdxTool-OTS-SarifMark-SarifReading
            title: SarifMark shall parse the SARIF 2.1 JSON file to extract rule violations and source locations.
            tags:
              - ots
              - ci-pipeline-verified
            justification: |
              SarifMark reads the CodeQL SARIF output and extracts rule violations and their source
              locations. This capability is exercised on every pipeline run and verified by the presence
              of the SARIF report artifact in the release bundle. See the OTS CI-Pipeline Exception in
              requirements-principles.md.

          - id: SpdxTool-OTS-SarifMark-MarkdownReport
            title: SarifMark shall render extracted SARIF findings as a structured markdown document.
            tags:
              - ots
              - ci-pipeline-verified
            justification: |-
              SarifMark produces a markdown report grouping results by rule and severity. When no
              violations are found it writes a document stating that no issues were detected. Full
              functional verification occurs through CI pipeline execution, where the SARIF report
              artifact in each release provides observable evidence of correct operation. See the OTS
              CI-Pipeline Exception in requirements-principles.md.
