---
# xUnit OTS requirements
# cspell:words xunit
sections:
  - title: OTS Software Requirements
    sections:
      - title: xUnit Requirements
        requirements:
          - id: SpdxTool-OTS-xUnit-Execution
            title: xUnit shall discover and execute unit test methods.
            tags:
              - ots
            justification: |
              xUnit (xunit.v3) is the unit-testing framework used by the project. It discovers
              all methods marked with [Fact] or [Theory] in the test assemblies and executes them.
              The successful passage of representative tests on every pipeline run constitutes
              verification that xUnit can discover and execute test methods for the project.
            tests:
              - SpdxTool_Version_ShortFlag_DisplaysVersion
              - SpdxTool_Version_LongFlag_DisplaysVersion
              - SpdxTool_Usage_ShortHelpFlag_DisplaysUsage

          - id: SpdxTool-OTS-xUnit-Reporting
            title: xUnit shall produce TRX result files for pipeline test reporting.
            tags:
              - ots
            justification: |
              xUnit (xunit.runner.visualstudio) writes TRX result files that feed into coverage
              reporting and requirements traceability via ReqStream. The successful pipeline
              completion with all requirements covered is direct evidence that TRX output was
              correctly produced and consumed.
            tests:
              - SpdxTool_Version_ShortFlag_DisplaysVersion
              - SpdxTool_Version_LongFlag_DisplaysVersion
              - SpdxTool_Usage_ShortHelpFlag_DisplaysUsage
