---
# xUnit OTS requirements
# cspell:words xunit
sections:
  - title: OTS Software Requirements
    sections:
      - title: xUnit Requirements
        requirements:
          - id: SpdxTool-OTS-xUnit
            title: xUnit v3 shall execute unit tests and report results.
            tags:
              - ots
            justification: |
              xUnit v3 (xunit.v3 and xunit.runner.visualstudio) is the unit-testing framework
              used by the project. It discovers and runs all test methods and writes TRX result
              files that feed into coverage reporting and requirements traceability.
            tests:
              - SpdxTool_Version_ShortFlag_DisplaysVersion
              - SpdxTool_Version_LongFlag_DisplaysVersion
              - SpdxTool_Usage_ShortHelpFlag_DisplaysUsage
