---
# BuildMark OTS requirements
sections:
  - title: OTS Software Requirements
    sections:
      - title: BuildMark Requirements
        requirements:
          - id: SpdxTool-OTS-BuildMark
            title: BuildMark shall be installed and invocable in the pipeline environment.
            tags:
              - ots
            justification: |
              DemaConsulting.BuildMark is a CI pipeline tool that generates build-notes documentation
              from GitHub Actions metadata. The linked test verifies installation only: it invokes
              buildmark with the --help flag to confirm the tool is present and responds correctly.
              Full functional verification of markdown report generation occurs through CI pipeline
              execution, where the presence of the build-notes artifact in each release provides
              observable evidence of correct operation.
            tests:
              - BuildMark_Tool_IsInstalled

          - id: SpdxTool-OTS-BuildMark-ApiQuery
            title: BuildMark shall query the GitHub Actions API to retrieve workflow run metadata.
            tags:
              - ots
              - ci-pipeline-verified
            justification: |
              BuildMark's primary function is to read workflow run identifier, trigger event, branch,
              commit SHA, and timestamp from the GitHub REST API. This capability is exercised on
              every pipeline run and verified by the presence of the build-notes artifact in the
              release bundle. See the OTS CI-Pipeline Exception in requirements-principles.md.
            tests:
              - BuildMark_GitIntegration
              - BuildMark_IssueTracking

          - id: SpdxTool-OTS-BuildMark-MarkdownReport
            title: BuildMark shall render retrieved workflow metadata as a structured markdown document.
            tags:
              - ots
              - ci-pipeline-verified
            justification: |-
              BuildMark produces a markdown build-notes document from the metadata it retrieves. Full
              functional verification occurs through CI pipeline execution, where the build-notes
              artifact in each release provides observable evidence that markdown generation worked
              correctly. See the OTS CI-Pipeline Exception in requirements-principles.md.
            tests:
              - BuildMark_MarkdownReportGeneration
